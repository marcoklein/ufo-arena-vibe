<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UFO Arena</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #0b0f14; }
      canvas { display: block; }

      #hud, #hint, #overlay {
        position: fixed;
        user-select: none;
        pointer-events: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      #hud {
        /* the whole panel scales off the shorter screen edge, so a big monitor
           does not shrink it away into the corner */
        left: max(16px, 1.7vmin); top: max(14px, 1.5vmin);
        color: #cbd5e1;
        text-shadow: 0 1px 3px #000;
        font-size: clamp(15px, 1.15vmin + 8px, 32px);
        line-height: 1.7;
        min-width: clamp(190px, 18vmin, 460px);
      }
      #hud .top { display: flex; justify-content: space-between; gap: 0.9em; }
      #lvl { color: #7dd3fc; font-weight: 700; letter-spacing: 0.06em; }
      #kills { color: #facc15; }
      #hpwrap {
        margin-top: 0.55em;
        height: 0.85em;
        background: rgba(148, 163, 184, 0.22);
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 0.6em;
        overflow: hidden;
      }
      #hpbar {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #22c55e, #a3e635);
        transition: width 0.12s linear;
      }
      #left { color: #fca5a5; }
      #hunt {
        display: none;
        margin-top: 0.2em;
        color: #ff5d8f;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-shadow: 0 0 12px rgba(255, 60, 120, 0.75);
        animation: huntpulse 0.55s ease-in-out infinite alternate;
      }
      @keyframes huntpulse {
        from { opacity: 0.45; }
        to { opacity: 1; }
      }

      /* the shade closing in: a red press at the edges of the screen */
      #huntveil {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(ellipse at center,
          rgba(60, 0, 30, 0) 24%, rgba(120, 0, 48, 0.34) 62%, rgba(168, 4, 62, 0.62) 100%);
      }

      #hint {
        left: 50%; bottom: max(14px, 1.4vmin);
        transform: translateX(-50%);
        color: #8296ad;
        font-size: clamp(12px, 0.85vmin + 5px, 20px);
        text-shadow: 0 1px 3px #000;
        white-space: nowrap;
      }
      #hint b { color: #7dd3fc; }

      #overlay {
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(3, 7, 12, 0.72);
        color: #f8fafc;
        font-family: ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }
      #overlay.show { display: flex; }
      #ovtitle {
        font-weight: 700;
        font-size: clamp(26px, 6vw, 52px);
        letter-spacing: 0.08em;
        text-shadow: 0 0 26px rgba(125, 211, 252, 0.6);
      }
      #ovsub { font-size: clamp(13px, 2.2vw, 17px); color: #93a3b8; }

      #hurt {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(ellipse at center, rgba(255, 0, 40, 0) 38%, rgba(214, 22, 60, 0.62) 100%);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.186.1/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="hurt"></div>
    <div id="huntveil"></div>
    <div id="hud">
      <div class="top"><span id="lvl">Level 1</span><span id="kills">0 kills</span></div>
      <div id="hpwrap"><div id="hpbar"></div></div>
      <div id="left">0 monsters</div>
      <div id="hunt">&#9650; THE SHADE IS AWAKE &#9650;</div>
    </div>
    <div id="hint"><b>W</b>/<b>S</b> drive &middot; <b>A</b>/<b>D</b> or <b>&larr;</b>/<b>&rarr;</b> turn &middot; <b>Space</b>/click shoot &middot; <b>R</b> restart</div>
    <div id="overlay"><span id="ovtitle"></span><span id="ovsub"></span></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
