<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UFO Arena</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #0b0f14; }
      canvas { display: block; }

      #hud, #hint, #overlay {
        position: fixed;
        user-select: none;
        pointer-events: none;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      #hud {
        /* the whole panel scales off the shorter screen edge, so a big monitor
           does not shrink it away into the corner */
        left: max(16px, 1.7vmin); top: max(14px, 1.5vmin);
        color: #cbd5e1;
        text-shadow: 0 1px 3px #000;
        font-size: clamp(15px, 1.15vmin + 8px, 32px);
        line-height: 1.7;
        min-width: clamp(190px, 18vmin, 460px);
      }
      #hud .top { display: flex; justify-content: space-between; gap: 0.9em; }
      #lvl { color: #7dd3fc; font-weight: 700; letter-spacing: 0.06em; }
      #kills { color: #facc15; }
      #snd { color: #93a3b8; }
      #snd.off { color: #f87171; font-weight: 700; }
      #hpwrap {
        margin-top: 0.55em;
        height: 0.85em;
        background: rgba(148, 163, 184, 0.22);
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 0.6em;
        overflow: hidden;
      }
      #hpbar {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #22c55e, #a3e635);
        transition: width 0.12s linear;
      }
      #left { color: #fca5a5; }

      /* the lift row: a sign by a charged pad, the clock while you are up */
      #lift {
        display: none;
        align-items: center;
        gap: 0.55em;
        margin-top: 0.25em;
        color: #7df3ff;
        letter-spacing: 0.08em;
      }
      #lift.on { display: flex; }
      #lift.near #liftwrap { display: none; }
      #lift.charging { color: #7c8ba1; }
      #lift.charging #liftbar { background: linear-gradient(90deg, #475569, #94a3b8); }
      #lift.block { color: #a3e635; }
      #lift.block #liftbar { background: linear-gradient(90deg, #65a30d, #bef264); }
      #lift.deny { color: #f87171; }
      #lift.warn {
        color: #ff6b6b;
        animation: huntpulse 0.45s ease-in-out infinite alternate;
      }
      #liftwrap {
        flex: 1;
        height: 0.5em;
        background: rgba(148, 163, 184, 0.18);
        border: 1px solid rgba(125, 243, 255, 0.35);
        border-radius: 0.4em;
        overflow: hidden;
      }
      #liftbar {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #22d3ee, #a5f3fc);
        transition: width 0.1s linear;
      }
      #lift.warn #liftbar { background: linear-gradient(90deg, #f97316, #ef4444); }
      #hunt {
        display: none;
        margin-top: 0.2em;
        color: #ff5d8f;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-shadow: 0 0 12px rgba(255, 60, 120, 0.75);
        animation: huntpulse 0.55s ease-in-out infinite alternate;
      }
      @keyframes huntpulse {
        from { opacity: 0.45; }
        to { opacity: 1; }
      }

      /* the shade closing in: a red press at the edges of the screen */
      #huntveil {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(ellipse at center,
          rgba(60, 0, 30, 0) 24%, rgba(120, 0, 48, 0.34) 62%, rgba(168, 4, 62, 0.62) 100%);
      }

      #hint {
        /* the bottom line scales off the shorter screen edge exactly like the HUD
           panel does: on a big monitor the old fixed-ish size was unreadable. It
           wraps instead of running off the edges, and it stays centred. */
        left: 50%; bottom: max(14px, 1.6vmin);
        transform: translateX(-50%);
        color: #b6c8dd;
        font-size: clamp(15px, 1.15vmin + 8px, 30px);
        line-height: 1.5;
        max-width: 94vw;
        text-align: center;
        text-shadow: 0 1px 4px #000;
      }
      #hint b { color: #7dd3fc; }

      #overlay {
        inset: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(3, 7, 12, 0.72);
        color: #f8fafc;
        font-family: ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }
      #overlay.show { display: flex; }
      #ovtitle {
        font-weight: 700;
        font-size: clamp(26px, 6vw, 52px);
        letter-spacing: 0.08em;
        text-shadow: 0 0 26px rgba(125, 211, 252, 0.6);
      }
      #ovsub { font-size: clamp(13px, 2.2vw, 17px); color: #93a3b8; }
      #ovsub b { color: #7dd3fc; }

      /* the start screen: the buttons are the one part of the overlay you click */
      #ovbtns {
        display: none;
        gap: clamp(10px, 1.4vmin, 18px);
        margin-top: clamp(6px, 1.2vmin, 16px);
        flex-wrap: wrap;
        justify-content: center;
      }
      #overlay.menu #ovbtns { display: flex; }
      #overlay button {
        pointer-events: auto;
        cursor: pointer;
        font: inherit;
        font-size: clamp(14px, 1.1vmin + 8px, 22px);
        font-weight: 600;
        letter-spacing: 0.03em;
        color: #eaf6ff;
        background: rgba(20, 36, 54, 0.92);
        border: 1px solid rgba(125, 211, 252, 0.5);
        border-radius: 10px;
        padding: 0.55em 1.1em;
        text-shadow: 0 1px 3px #000;
      }
      #overlay button:hover,
      #overlay button:focus-visible {
        background: rgba(38, 78, 110, 0.95);
        border-color: #7dd3fc;
        outline: none;
      }
      #overlay button b { color: #7dd3fc; }

      #hurt {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(ellipse at center, rgba(255, 0, 40, 0) 38%, rgba(214, 22, 60, 0.62) 100%);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.186.1/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="hurt"></div>
    <div id="huntveil"></div>
    <div id="hud">
      <div class="top"><span id="lvl">Level 1</span><span id="kills">0 kills</span><span id="snd">sound on</span></div>
      <div id="hpwrap"><div id="hpbar"></div></div>
      <div id="left">0 monsters</div>
      <div id="lift"><span id="liftlab">HOVER</span><div id="liftwrap"><div id="liftbar"></div></div></div>
      <div id="hunt">&#9650; THE SHADE IS AWAKE &#9650;</div>
    </div>
    <div id="hint"><b>W</b>/<b>S</b> drive &middot; <b>A</b>/<b>D</b> or <b>&larr;</b>/<b>&rarr;</b> turn &middot; <b>Space</b>/click shoot &middot; <b>F</b> fullscreen &middot; <b>M</b> sound &middot; <b>R</b> restart</div>
    <div id="overlay">
      <span id="ovtitle"></span>
      <span id="ovsub"></span>
      <div id="ovbtns">
        <button id="btncont" type="button">Start</button>
        <button id="btnnew" type="button">New game &middot; level 1</button>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
